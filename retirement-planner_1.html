"use strict";
const e = React.createElement;
const {useState, useEffect, useMemo} = React;

  BarChart, Bar, Legend, ReferenceLine, Area, AreaChart, ComposedChart
} = Recharts;

// ---- קבועים ----
const TAX2026 = {
  cgtFlat: 0.25,
  over60Ceiling: 193800,
  over60Bands: [
    {upTo:84120,rate:0.10},{upTo:120720,rate:0.14},
    {upTo:193800,rate:0.20},{upTo:Infinity,rate:0.25}
  ]
};

const ils = new Intl.NumberFormat("he-IL",{style:"currency",currency:"ILS",maximumFractionDigits:0});
const fmt = n => isFinite(n) ? ils.format(Math.round(n)) : "—";
const fmtK = n => isFinite(n) ? "₪"+Math.round(n).toLocaleString("he-IL") : "—";
const pct = n => isFinite(n) ? (n*100).toFixed(1)+"%" : "—";
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

function cgtOnGain(gain,age,oi){
  if(gain<=0) return 0;
  if(age<60) return gain*TAX2026.cgtFlat;
  let hi=oi+gain,tax=0,prev=0;
  for(const b of TAX2026.over60Bands){
    const seg=Math.max(0,Math.min(hi,b.upTo)-Math.max(oi,prev));
    if(seg>0) tax+=seg*b.rate;
    prev=b.upTo;
    if(b.upTo>=hi) break;
  }
  return tax;
}

// ---- ברירות מחדל ----
const PERSON = over => ({
  name:"בן/בת זוג",currentAge:55,retirementAge:55,
  portfolio:1000000,portfolioTaxOnSale:0,
  studyFund:250000,studyFundLiquidAge:60,
  rsuVestedGross:0,rsuUnvestedExpected:0,rsuTaxRate:25,
  pensionNetMonthly:7000,pensionStartAge:67,
  allowanceMonthly:1838,allowanceStartAge:70,
  severance:0,...over
});

const DEFAULTS = {
  targetMonthly:50000,passiveMonthly:20000,passiveIndexed:true,inflation:3,
  cash:0,safetyBuffer:15,stressMarketDrop:25,stressPassiveFactor:60,
  planStartYears:1,planningAge:95,expReturn:5,cashReturn:2,
  cashBucketMonths:18,refillCadence:12,
  rsuSpreadYears:4,rsuPreferAfter60:true,
  extraItems:[
    {id:1,label:"שכירות נדל\"ן (נטו/חודש)",amount:20000},
    {id:2,label:"החזר השקעת נדל\"ן (צפי)",amount:595000},
    {id:3,label:"תיק השקעות נוסף",amount:0},
  ],
  people:[
    PERSON({name:"ניר",currentAge:0,retirementAge:0,
      studyFund:853376,studyFundLiquidAge:60,
      portfolio:1423171,portfolioTaxOnSale:0,
      rsuVestedGross:0,rsuUnvestedExpected:0,rsuTaxRate:25,
      pensionNetMonthly:28861,pensionStartAge:67,
      allowanceMonthly:1838,allowanceStartAge:70,severance:1158874}),
    PERSON({name:"מאיה",currentAge:0,retirementAge:0,
      studyFund:808705,studyFundLiquidAge:60,
      portfolio:459489,portfolioTaxOnSale:0,
      rsuVestedGross:0,rsuUnvestedExpected:0,rsuTaxRate:0,
      pensionNetMonthly:28861,pensionStartAge:67,
      allowanceMonthly:1838,allowanceStartAge:70,severance:782089}),
  ]
};

// ---- חישוב ----
function compute(H){
  const infl=(H.inflation||0)/100,buf=(H.safetyBuffer||0)/100;
  const ret=(H.expReturn||0)/100,cr=(H.cashReturn||0)/100;
  const P=H.people,NOW=2026;
  const totVestedNet=P.reduce((s,p)=>s+(p.rsuVestedGross||0)*(1-(p.rsuTaxRate||0)/100),0);
  const totPort=P.reduce((s,p)=>s+(p.portfolio||0),0);
  const totStudy=P.reduce((s,p)=>s+(p.studyFund||0),0);
  const liquidNet=(H.cash||0)+totPort+totVestedNet;
  const monthlyGap=(H.targetMonthly||0)-(H.passiveMonthly||0);
  const annualGap=monthlyGap*12;
  const tStart=Math.max(0,H.planStartYears||0);
  const horizon=clamp(Math.max(...P.map(p=>(H.planningAge||95)-(p.currentAge||0))),1,50);
  let firstLayerT=horizon;
  P.forEach(p=>{
    const pT=(p.pensionStartAge||200)-(p.currentAge||0);
    const aT=(p.allowanceStartAge||200)-(p.currentAge||0);
    firstLayerT=Math.min(firstLayerT,Math.max(pT,tStart),Math.max(aT,tStart));
  });
  const bridgeYears=Math.max(0,Math.round(firstLayerT-tStart));
  let cashBal=H.cash||0;
  const ports=P.map(p=>({bal:p.portfolio||0,tf:(p.portfolio||0)>0?(p.portfolioTaxOnSale||0)/(p.portfolio||1):0}));
  const studies=P.map(p=>({bal:p.studyFund||0,liq:p.studyFundLiquidAge||60}));
  const rows=[];let depAge=null,bridgeReq=0;
  for(let t=tStart;t<=horizon;t++){
    const ages=P.map(p=>(p.currentAge||0)+t);
    ports.forEach(x=>x.bal*=1+ret);cashBal*=1+cr;
    const exp=(H.targetMonthly||0)*12*Math.pow(1+infl,t);
    const pas=(H.passiveMonthly||0)*12*(H.passiveIndexed?Math.pow(1+infl,t):1);
    const pens=P.map((p,k)=>ages[k]>=(p.pensionStartAge||200)?(p.pensionNetMonthly||0)*12:0);
    const alls=P.map((p,k)=>ages[k]>=(p.allowanceStartAge||200)?(p.allowanceMonthly||0)*12:0);
    const pensT=pens.reduce((s,x)=>s+x,0),allT=alls.reduce((s,x)=>s+x,0);
    const gap=Math.max(0,exp-pas-pensT-allT);
    if(t<tStart+bridgeYears)bridgeReq+=gap;
    let need=gap,fc=0,fs=0,fp=0,tax=0;
    const c=Math.min(cashBal,need);cashBal-=c;need-=c;fc=c;
    studies.forEach((s,k)=>{if(need<=0.5||s.bal<=0)return;if(ages[k]>=s.liq){const d=Math.min(s.bal,need);s.bal-=d;need-=d;fs+=d;}});
    for(let pass=0;pass<2&&need>0.5;pass++){
      const tb=ports.reduce((s,x)=>s+x.bal,0);if(!tb)break;
      ports.forEach((x,k)=>{
        if(need<=0.5||x.bal<=0)return;
        const gross=Math.min(x.bal,need/(1-x.tf));
        const tx=gross*x.tf;const net=gross-tx;
        x.bal-=gross;fp+=net;tax+=tx;need-=net;
      });
    }
    const portEnd=ports.reduce((s,x)=>s+x.bal,0);
    if(need>0.5&&depAge===null)depAge=Math.min(...ages);
    rows.push({t,year:NOW+t,ageLabel:ages.join(" / "),minAge:Math.min(...ages),
      expenses:exp,passive:pas,pension:pensT,allowance:allT,gap,
      fromCash:fc,fromStudy:fs,fromPort:fp,tax,portEnd,
      shortfall:need>0.5?need:0,phase:allT>0?"ד":pensT>0?"ב/ג":"א"});
  }
  const bridgeBuf=bridgeReq*(1+buf);
  const ratio=bridgeBuf>0?liquidNet/bridgeBuf:(liquidNet>0?99:0);
  const surplus=liquidNet-bridgeBuf;
  const status=bridgeYears===0?"decision":ratio>=1.25?"green":ratio>=1?"amber":"red";
  const wRate=liquidNet>0?annualGap/liquidNet:0;
  const passCov=(H.targetMonthly||0)>0?(H.passiveMonthly||0)/(H.targetMonthly||0):0;
  const rsuConc=liquidNet>0?totVestedNet/liquidNet:0;
  const cashMo=monthlyGap>0?(H.cash||0)/monthlyGap:Infinity;
  let reqS=0;
  for(let t=tStart;t<tStart+bridgeYears;t++){
    const ex=(H.targetMonthly||0)*12*Math.pow(1+infl,t);
    const pa=(H.passiveMonthly||0)*(H.stressPassiveFactor||100)/100*12*(H.passiveIndexed?Math.pow(1+infl,t):1);
    reqS+=Math.max(0,ex-pa);
  }
  reqS*=1+buf;
  const avS=(H.cash||0)+totPort*(1-(H.stressMarketDrop||0)/100)+totVestedNet*(1-(H.stressMarketDrop||0)/100);
  const stressR=reqS>0?avS/reqS:(avS>0?99:0);
  const resilient=stressR>=1;
  const draw=monthlyGap;
  const bucketT=draw*(H.cashBucketMonths||0);
  let bucket=Math.min(H.cash||0,bucketT||(H.cash||0));
  const cashFlow=[];let refTax=0;
  for(let m=1;m<=24;m++){
    bucket-=draw;let refill=0;
    if((H.refillCadence||12)>0&&m%(H.refillCadence||12)===0){
      refill=Math.max(0,bucketT-bucket);bucket+=refill;
      refTax+=refill*(totPort>0?P.reduce((s,p)=>s+(p.portfolioTaxOnSale||0),0)/totPort:0)*0.25;
    }
    cashFlow.push({m,bucket:Math.round(bucket),refill:Math.round(refill)});
  }
  const rsuPlans=P.filter(p=>(p.rsuVestedGross||0)>0).map(p=>{
    const n=Math.max(1,H.rsuSpreadYears||1);
    const st=H.rsuPreferAfter60?Math.max(tStart,60-(p.currentAge||0)):tStart;
    const tr=(p.rsuVestedGross||0)/n,gp=0.7,oi=(H.passiveMonthly||0)/P.length*12;
    const sched=[];
    for(let k=0;k<n;k++){const tt=st+k,age=(p.currentAge||0)+tt;const tax=cgtOnGain(tr*gp,age,oi);sched.push({year:NOW+tt,age,amount:tr,tax,rate:tax/(tr*gp)});}
    const lT=cgtOnGain((p.rsuVestedGross||0)*gp,(p.currentAge||0)+tStart,oi);
    const spT=sched.reduce((s,x)=>s+x.tax,0);
    return{name:p.name,sched,lumpTax:lT,spreadTax:spT,saving:lT-spT};
  });
  const A=[];
  if(bridgeYears>0&&ratio<1)A.push({level:"red",t:"חסר הון לגשר",x:`חסרים כ־${fmt(-surplus)} למימון הגשר (כולל כרית ${H.safetyBuffer}%).`});
  if(cashMo<12)A.push({level:"red",t:"כרית נזילות לא מספקת",x:`${isFinite(cashMo)?cashMo.toFixed(0):"∞"} חודשי פער במזומן. לא לפרוש לפני 12–24 חודשים.`});
  else if(cashMo<24)A.push({level:"amber",t:"כרית נזילות בינונית",x:`${cashMo.toFixed(0)} חודשי פער. כדאי לכוון ל-24+.`});
  if(rsuConc>0.25)A.push({level:"red",t:"ריכוזיות RSU גבוהה",x:`RSU = ${pct(rsuConc)} מההון הנזיל.`});
  else if(rsuConc>0.10)A.push({level:"amber",t:"בדיקת מימוש RSU מדורג",x:`RSU = ${pct(rsuConc)} מההון הנזיל.`});
  if(depAge!==null)A.push({level:"red",t:"התיק עלול להיגמר",x:`ההון מסתיים סביב גיל ${depAge}.`});
  if(bridgeYears>0&&!resilient)A.push({level:"red",t:"לא שורד תרחיש לחץ",x:`יחס ${pct(stressR)} בתרחיש לחץ.`});
  if(wRate>0.05)A.push({level:"amber",t:"שיעור משיכה גבוה",x:`${pct(wRate)} מהנכסים בשנה.`});
  P.forEach(p=>{if((p.currentAge||0)<60)A.push({level:"info",t:`הטבת מס 60+ — ${p.name}`,x:`מגיל 60 מדרגות מס מופחתות 10/14/20% עד תקרת ₪193,800.`});});
  if(P.some(p=>(p.rsuVestedGross||0)>0))A.push({level:"info",t:"יועץ מס לפני מימוש RSU",x:"לאמת מסלול 102 עם רו\"ח."});
  if(P.some(p=>(p.severance||0)>0))A.push({level:"info",t:"פיצויים — בדיקת רו\"ח",x:"לא נכלל בחישוב הגשר."});
  A.push({level:"info",t:"קיבוע זכויות",x:"החלטה כמעט בלתי הפיכה — עם יועץ פרישה."});
  if(bridgeYears>0&&ratio>=1.25&&resilient&&depAge===null&&cashMo>=12)
    A.unshift({level:"good",t:"הגשר אפשרי",x:`הנכסים מכסים ${pct(ratio)} מהגשר.`});
  return{liquidNet,totPort,totStudy,totVestedNet,monthlyGap,annualGap,bridgeYears,bridgeReq,bridgeBuf,ratio,surplus,status,wRate,passCov,rsuConc,cashMo,stressR,resilient,rows,depAge,cashFlow,refTax,draw,bucketT,rsuPlans,alerts:A};
}

// ---- UI Components ----
function Money({label,hint,value,onChange}){
  return e('div',{className:'field'},
    e('label',null,label),
    e('div',{className:'inp'},
      e('input',{type:'number',inputMode:'numeric',value,onChange:ev=>onChange(ev.target.value===''?0:Number(ev.target.value))}),
      e('span',{className:'suf'},'₪')
    ),
    e('div',{className:'hint'},hint||fmt(value))
  );
}
function Num({label,hint,value,onChange,suffix}){
  return e('div',{className:'field'},
    e('label',null,label),
    e('div',{className:'inp'},
      e('input',{type:'number',inputMode:'numeric',value,onChange:ev=>onChange(ev.target.value===''?0:Number(ev.target.value))}),
      suffix&&e('span',{className:'suf'},suffix)
    ),
    hint&&e('div',{className:'hint'},hint)
  );
}
function Txt({label,value,onChange}){
  return e('div',{className:'field'},
    e('label',null,label),
    e('div',{className:'inp'},e('input',{type:'text',value,onChange:ev=>onChange(ev.target.value)}))
  );
}
function Toggle({label,value,onChange}){
  return e('div',{className:'field'},
    e('div',{className:'tgl'},
      e('span',{style:{fontWeight:600,fontSize:13}},label),
      e('button',{className:'tg-btn'+(value?' on':''),onClick:()=>onChange(!value)},e('span'))
    )
  );
}
function Metric({label,value,s,note}){
  return e('div',{className:'metric '+s},
    e('span',{className:'ml'},label),
    e('span',{className:'mv'},value),
    note&&e('span',{className:'mn'},note)
  );
}
function sOf(v,g,a){return v>=g?'sg':v>=a?'sa':'sr';}

function BridgeSVG({d}){
  const deckY=100,x0=70,x1=560;
  const fx=x0+(x1-x0)*clamp(d.ratio,0,1);
  const pillars=[x0,x0+(x1-x0)/3,x0+2*(x1-x0)/3,x1];
  return e('svg',{viewBox:'0 0 680 170',className:'bridge-svg'},
    e('line',{x1:30,y1:140,x2:650,y2:140,stroke:'#27463b',strokeWidth:2}),
    ...pillars.map((px,k)=>e('line',{key:k,x1:px,y1:deckY+8,x2:px,y2:140,stroke:'#3a5a4d',strokeWidth:6,strokeLinecap:'round'})),
    e('rect',{x:x0-22,y:deckY-6,width:22,height:64,rx:4,fill:'#27463b'}),
    e('rect',{x:x1,y:deckY-6,width:22,height:64,rx:4,fill:'#27463b'}),
    e('rect',{x:x0,y:deckY,width:x1-x0,height:12,rx:6,fill:'#27463b'}),
    e('rect',{x:x0,y:deckY,width:Math.max(0,fx-x0),height:12,rx:6,fill:'#cdb06a'}),
    e('path',{d:`M ${x0} ${deckY} Q ${(x0+x1)/2} ${deckY+50} ${x1} ${deckY}`,fill:'none',stroke:'#3a5a4d',strokeWidth:2,opacity:0.6}),
    e('text',{x:(x0+x1)/2,y:82,fill:'#f0ead8',fontSize:17,textAnchor:'middle',fontWeight:700,fontFamily:'Assistant'},'גשר של '+d.bridgeYears+' שנים'),

            :e('div',{className:'scrollx'},
              e('table',{className:'tbl'},
                e('thead',null,e('tr',null,...['תאריך','יחס','זמין','נדרש','עד גיל',''].map(h=>e('th',{key:h},h)))),
                e('tbody',null,...[...snaps].reverse().map(s=>e('tr',{key:s.id},
                  e('td',null,s.date),
                  e('td',null,pct(s.ratio)),
                  e('td',null,fmt(s.available)),
                  e('td',null,fmt(s.required)),
                  e('td',null,s.depleted?'גיל '+s.depleted:'מחזיק'),
                  e('td',null,e('button',{className:'btn btn-danger',style:{padding:'4px 10px',fontSize:12},onClick:()=>delSnap(s.id)},'מחקי'))
                )))
              )
            )
        )
      ),

      e('p',{style:{fontFamily:'serif',fontSize:15,color:'#1d3f38',padding:'12px 14px',margin:'0 0 12px',background:'#fff',borderRadius:'0 12px 12px 0',borderInlineStart:'3px solid #b0852f'}},
        `הכלל המרכזי: גשר של ~${d.bridgeYears} שנים, ואז כניסה מדורגת של פנסיה וקצבת זקנה.`),
      e('p',{style:{fontSize:11,color:'var(--muted)',marginTop:8}},
        'כלי לחישוב ומעקב בלבד. אומדני המס מבוססים על קבועי 2026 ואינם תחליף לייעוץ מס, פנסיה או השקעות.')
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
